services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: cardgame
      MYSQL_USER: cardgame
      MYSQL_PASSWORD: cardgame1234
      MYSQL_ROOT_PASSWORD: root1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "dev-key-change-me"
      DB_NAME: cardgame
      DB_USER: cardgame
      DB_PASSWORD: cardgame1234
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
